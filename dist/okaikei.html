<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お会計になります</title>
<meta name="description" content="財布を忘れた。ただそれだけの、決済脱出アドベンチャー。">
<meta name="theme-color" content="#2a231c">
<meta property="og:type" content="website">
<meta property="og:title" content="お会計になります">
<meta property="og:description" content="財布を忘れた。ただそれだけの、決済脱出アドベンチャー。ブラウザで10〜20分。">
<style>
:root{
  --bg:#efe6d8; --bg2:#e2d4c0; --wood:#8a5a3b; --wood2:#6d452c;
  --ink:#2a231c; --ink2:#5c5147; --line:#cbb99f;
  --accent:#c0563c; --accent2:#e08a4a; --ok:#3f8f6e; --ng:#b8422f;
  --phone:#14161d; --phone2:#1e222c; --phoneline:#2c313d;
  --font: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,"Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:var(--font); background:#1a1611; color:var(--ink);
  font-size:15px; line-height:1.6; overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1180px;margin:0 auto;background:var(--bg);position:relative}

/* ---------- HUD ---------- */
#hud{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:linear-gradient(#3a2f25,#2a231c);color:#f0e6d6;border-bottom:2px solid #17120e;
  font-size:12px;position:relative;z-index:30;
}
.bill{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.bill b{color:#ffd98a;font-size:15px}
.clock{opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.gauges{display:flex;gap:10px;flex:1;min-width:0;overflow:hidden;justify-content:center}
.g{flex:1 1 0;min-width:52px;max-width:150px}
.g .gl{display:flex;justify-content:space-between;font-size:10px;opacity:.8;line-height:1.2}
.g .gb{height:6px;border-radius:3px;background:#00000055;overflow:hidden;margin-top:2px}
.g .gf{height:100%;width:50%;border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.g.trust .gf{background:linear-gradient(90deg,#4f9,#2c8)}
.g.shame .gf{background:linear-gradient(90deg,#f9a,#e46)}
.g.conf  .gf{background:linear-gradient(90deg,#fd8,#f93)}
.hud-right{display:flex;gap:4px}
.hud-right button{width:30px;height:28px;border-radius:7px;background:#ffffff18;font-size:14px}
.hud-right button:active{background:#ffffff35}
.batt{display:flex;align-items:center;gap:4px;white-space:nowrap}
.batt .cell{width:26px;height:11px;border:1.5px solid #f0e6d6aa;border-radius:2px;position:relative;padding:1px}
.batt .cell:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#f0e6d6aa;border-radius:0 1px 1px 0}
.batt .lv{height:100%;background:#7de08a;border-radius:1px;transition:width .4s}
.batt.low .lv{background:#f7b955}
.batt.crit .lv{background:#ef5a4a}
.batt.crit{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}

/* ---------- STAGE ---------- */
#stage{flex:1 1 auto;position:relative;min-height:0;display:flex;overflow:hidden}
#scene{flex:1 1 auto;position:relative;min-width:0;background:#d9c7ad}
#scene svg{width:100%;height:100%;display:block}
#sceneFx{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .5s}
#sceneFx.on{opacity:.82}
#dramaText{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:#fff;font-size:clamp(18px,4.4vw,34px);font-weight:800;letter-spacing:.15em;
  text-align:center;padding:20px;pointer-events:none;z-index:5;text-shadow:0 0 24px #f008;
}
#dramaText.on{display:flex;animation:dramaIn .8s ease-out}
@keyframes dramaIn{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
#noticeLayer{position:absolute;top:8px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6}
.notice{background:#2a231ce6;color:#ffe9c4;padding:5px 12px;border-radius:20px;font-size:12px;animation:noticeIn .3s;box-shadow:0 3px 10px #0004}
.notice.bad{background:#8d2f22e6;color:#ffe2dc}
.notice.good{background:#2b6b52e6;color:#dbf7e9}
@keyframes noticeIn{from{opacity:0;transform:translateY(-8px)}}
#deltaLayer{position:absolute;inset:0;pointer-events:none;z-index:7}
.delta{position:absolute;font-size:13px;font-weight:800;animation:deltaUp 1.3s ease-out forwards;text-shadow:0 2px 6px #0006}
@keyframes deltaUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}

/* ---------- PHONE ---------- */
#phone{
  flex:0 0 330px;background:#2a231c;padding:12px 12px 12px 4px;display:flex;align-items:center;justify-content:center;
}
.handset{
  width:100%;max-width:306px;aspect-ratio:9/17.5;max-height:100%;background:var(--phone);
  border-radius:30px;border:7px solid #0b0d11;box-shadow:0 10px 30px #0007, inset 0 0 0 1px #ffffff12;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.handset.dead{filter:grayscale(1) brightness(.35)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:17px;background:#0b0d11;border-radius:0 0 12px 12px;z-index:4}
.pstat{flex:0 0 auto;display:flex;justify-content:space-between;padding:6px 14px 2px;font-size:10px;color:#c9d0de;font-variant-numeric:tabular-nums}
.pscreen{flex:1 1 auto;overflow-y:auto;padding:6px 10px 10px;color:#e7ebf3;-webkit-overflow-scrolling:touch}
.pscreen::-webkit-scrollbar{width:5px}.pscreen::-webkit-scrollbar-thumb{background:#3a4152;border-radius:3px}
.phome{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;padding:8px 2px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:#c9d0de;text-align:center;line-height:1.15}
.appicon .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 2px 6px #0006;position:relative;transition:transform .12s}
.appicon:active .ic{transform:scale(.9)}
.appicon .badge{position:absolute;top:-4px;right:-4px;background:#e5484d;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.apptitle{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;border-bottom:1px solid var(--phoneline);margin-bottom:8px}
.apptitle button{font-size:13px;color:#7aa2ff}
.apptitle h3{margin:0;font-size:14px;font-weight:600;flex:1}
.prow{
  display:block;width:100%;text-align:left;background:var(--phone2);border:1px solid var(--phoneline);
  border-radius:11px;padding:9px 11px;margin-bottom:7px;font-size:12.5px;color:#e7ebf3;transition:background .15s;
}
.prow:active{background:#2b3140}
.prow .sub{display:block;font-size:10.5px;color:#8b93a5;margin-top:2px;line-height:1.4}
.prow.done{opacity:.42}
.prow.done .sub:after{content:" ・済";color:#6b7383}
.pnote{font-size:11px;color:#8b93a5;padding:4px 4px 10px;line-height:1.6}
.pbal{background:linear-gradient(135deg,#243046,#1a2233);border-radius:13px;padding:12px;margin-bottom:10px;border:1px solid #2f3c55}
.pbal .l{font-size:10px;color:#8fa3c4}
.pbal .v{font-size:22px;font-weight:700;letter-spacing:.02em;color:#eaf0ff}
.chat{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.bub{max-width:82%;padding:7px 10px;border-radius:13px;font-size:12px;line-height:1.5;position:relative}
.bub.me{align-self:flex-end;background:#7ad07a;color:#10240f;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#2b3140;border-bottom-left-radius:4px}
.bub .read{position:absolute;left:-30px;bottom:2px;font-size:9px;color:#8b93a5;white-space:nowrap}
.bub.me .read{left:auto;right:100%;margin-right:5px}
#phoneToggle{display:none}

/* ---------- BOTTOM ---------- */
#bottom{flex:0 0 auto;background:var(--bg);border-top:3px solid var(--wood2);z-index:20}
#dialogue{
  position:relative;padding:10px 14px 8px;min-height:96px;background:linear-gradient(#fffaf1,#f4ead9);
  border-bottom:1px solid var(--line);cursor:pointer;
}
#dlgName{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.06em;min-height:16px}
#dlgText{font-size:15px;line-height:1.75;min-height:52px;white-space:pre-wrap;color:var(--ink)}
#dlgText .inner{color:#4b5a7a;font-style:italic}
#dlgNext{
  position:absolute;right:10px;bottom:6px;font-size:11.5px;font-weight:700;color:#ffeccd;
  background:var(--accent);padding:4px 11px;border-radius:14px;animation:bob 1s infinite;
  opacity:0;transition:opacity .15s;box-shadow:0 2px 6px #0002;
}
#dlgNext.on{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{padding:6px 8px 10px;max-height:32dvh;display:flex;flex-direction:column;min-height:0;position:relative}
#choices.locked #tabs,#choices.locked #actionList{opacity:.3;filter:grayscale(.5)}
#lockNote{
  position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;
  cursor:pointer;background:linear-gradient(180deg,#efe6d8bb,#efe6d8ee);
}
#choices.locked #lockNote{display:flex}
#lockNote span{
  background:var(--ink);color:#ffeccd;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;
  letter-spacing:.04em;box-shadow:0 4px 14px #0003;animation:bob 1.1s infinite;
}
#phoneLock{
  position:absolute;inset:0;z-index:6;display:none;align-items:flex-end;justify-content:center;
  padding-bottom:22px;background:#0b0d11aa;cursor:pointer;border-radius:24px;
}
#phoneLock span{background:#f0e6d6;color:#2a231c;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:700;animation:bob 1.1s infinite}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;flex:0 0 auto}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:5px 11px;border-radius:16px;background:#e2d4c0;font-size:12px;font-weight:600;
  color:var(--ink2);border:1px solid transparent;white-space:nowrap;position:relative;
}
.tab.on{background:var(--ink);color:#ffeccd}
.tab .n{font-size:10px;opacity:.7;margin-left:3px}
.tab .dot{position:absolute;top:2px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#actionList{overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px;min-height:0}
.act{
  text-align:left;background:#fffaf1;border:1px solid var(--line);border-radius:10px;padding:8px 11px;
  font-size:13.5px;color:var(--ink);box-shadow:0 1px 0 #0000000d;transition:transform .1s,background .15s;
}
.act:active{transform:translateY(1px);background:#f6ead4}
.act .sub{display:block;font-size:11px;color:var(--ink2);margin-top:1px}
.act.done{opacity:.45}
.act.new{border-color:var(--accent);box-shadow:0 0 0 2px #c0563c22}
.act.new:before{content:"NEW ";font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.08em}
.act.risky{border-color:#b8422f88;background:#fff3ee}
.act.risky:after{content:"⚠";float:right;color:var(--ng);font-size:12px}
.emptyNote{font-size:12px;color:var(--ink2);padding:10px 4px}

/* ---------- OVERLAYS ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:#120f0bee}
.overlay.on{display:flex}
.card{max-width:520px;width:100%;background:var(--bg);border-radius:16px;padding:22px;max-height:88dvh;overflow-y:auto;box-shadow:0 20px 50px #000a}
#title h1{font-family:var(--font);font-size:clamp(30px,8vw,54px);margin:.1em 0 .2em;letter-spacing:.06em;color:#ffeccd;text-align:center;text-shadow:0 4px 20px #0008}
#title .sub{color:#c9b79a;text-align:center;font-size:13px;letter-spacing:.16em;margin-bottom:6px}
#title .lead{color:#e8dcc7;font-size:13.5px;line-height:1.9;max-width:440px;margin:14px auto 0;text-align:left;background:#00000038;padding:14px 16px;border-radius:12px}
#title .btns{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:18px auto 0}
.bigbtn{background:var(--accent);color:#fff5ec;padding:13px;border-radius:12px;font-size:16px;font-weight:700;letter-spacing:.08em;box-shadow:0 5px 0 #8d3b28}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #8d3b28}
.subbtn{background:#ffffff1a;color:#e8dcc7;padding:9px;border-radius:10px;font-size:13px}
#endCard .etag{font-size:11px;letter-spacing:.3em;color:var(--accent);font-weight:800}
#endCard h2{margin:.15em 0 .5em;font-size:clamp(24px,6vw,34px);letter-spacing:.05em}
#endCard .edesc{font-size:14px;line-height:1.9;white-space:pre-wrap}
#endCard .stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin:16px 0;font-size:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
#endCard .stats div{display:flex;justify-content:space-between;gap:8px}
#endCard .stats b{font-variant-numeric:tabular-nums}
.endlist{font-size:11.5px;color:var(--ink2);line-height:1.8}
.endlist .got{color:var(--ok);font-weight:700}
#confirmCard{max-width:400px;text-align:center}
#confirmCard p{font-size:14.5px;line-height:1.8;margin:4px 0 18px;white-space:pre-wrap}
#confirmCard .row{display:flex;gap:10px}
#confirmCard .row button{flex:1;padding:12px;border-radius:11px;font-size:14px;font-weight:700}
#curtain{
  position:fixed;inset:0;z-index:200;background:#120f0b;opacity:0;pointer-events:none;
  transition:opacity .5s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
#curtain.on{opacity:1;pointer-events:all}
#curtain .ct{color:#ffeccd;font-size:clamp(22px,6vw,40px);font-weight:800;letter-spacing:.32em;text-align:center}
#curtain .cs{color:#c9b79a;font-size:13px;letter-spacing:.2em}
.runTag{
  background:var(--accent);color:#fff5ec;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;
  letter-spacing:.06em;white-space:nowrap;display:none;
}
.runTag.on{display:inline-block}
#newGameFlash{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;pointer-events:none;
  background:#2a231cf0;color:#ffeccd;padding:7px 18px;border-radius:20px;font-size:13px;font-weight:700;
  letter-spacing:.08em;opacity:0;box-shadow:0 4px 14px #0005;
}
#newGameFlash.on{animation:flashIn 2.6s ease-out}
@keyframes flashIn{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0}}
.yes{background:var(--ng);color:#fff}
.no{background:#e2d4c0;color:var(--ink)}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 860px){
  #phone{
    position:absolute;inset:0;flex:none;padding:8px;background:#000000cc;z-index:25;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.9,.3,1);backdrop-filter:blur(2px);
  }
  #phone.open{transform:translateY(0)}
  .handset{max-width:330px;aspect-ratio:auto;height:100%;max-height:100%}
  #phoneToggle{
    display:flex;align-items:center;gap:5px;position:absolute;right:10px;bottom:10px;z-index:24;
    background:var(--ink);color:#ffeccd;padding:9px 14px;border-radius:22px;font-size:13px;font-weight:700;
    box-shadow:0 4px 12px #0005;
  }
  #choices{max-height:38dvh}
  #dlgText{font-size:14.5px}
}
@media (max-width: 560px){
  #hud{gap:6px;padding:5px 8px}
  .bill{font-size:11px}
  .bill b{font-size:13px}
  .clock{display:none}
  .g .gl{font-size:9px}
  .gauges{gap:6px}
  #phoneToggle{z-index:26}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <span class="bill">お会計 <b>¥1,480</b></span>
    <span class="clock" id="clock">13:12</span>
    <span class="runTag" id="runTag"></span>
    <div class="gauges">
      <div class="g trust"><div class="gl"><span>信用度</span><span id="vTrust">50</span></div><div class="gb"><div class="gf" id="bTrust"></div></div></div>
      <div class="g shame"><div class="gl"><span>羞恥心</span><span id="vShame">5</span></div><div class="gb"><div class="gf" id="bShame"></div></div></div>
      <div class="g conf"><div class="gl"><span>困惑度</span><span id="vConf">0</span></div><div class="gb"><div class="gf" id="bConf"></div></div></div>
    </div>
    <div class="batt" id="battWrap"><div class="cell"><div class="lv" id="battLv"></div></div><span id="battTx">47%</span></div>
    <div class="hud-right">
      <button id="btnSound" title="音">🔊</button>
      <button id="btnRestart" title="やり直す">↺</button>
    </div>
  </header>

  <div id="stage">
    <section id="scene">
      <svg viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" id="sceneSvg">
        <defs>
          <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e8d8bd"/><stop offset="1" stop-color="#cfb897"/>
          </linearGradient>
          <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a8794f"/><stop offset="1" stop-color="#8a5f3c"/>
          </linearGradient>
          <linearGradient id="winG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cfe6f0"/><stop offset="1" stop-color="#a9cbd8"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="640" height="232" fill="url(#wallG)"/>
        <rect x="0" y="232" width="640" height="168" fill="url(#floorG)"/>
        <rect x="0" y="226" width="640" height="9" fill="#7a5133"/>
        <g id="window">
          <rect x="24" y="76" width="140" height="96" rx="5" fill="url(#winG)"/>
          <rect x="24" y="76" width="140" height="96" rx="5" fill="none" stroke="#8b6a48" stroke-width="5"/>
          <line x1="94" y1="76" x2="94" y2="172" stroke="#8b6a48" stroke-width="4"/>
          <circle cx="55" cy="104" r="12" fill="#f2efe2" opacity=".7"/>
          <rect x="108" y="132" width="40" height="40" fill="#9fbcae" opacity=".5"/>
          <g id="phoneBox" opacity=".9">
            <rect x="116" y="122" width="17" height="50" fill="#3f7f6f"/>
            <rect x="118" y="126" width="13" height="18" fill="#cfe6e0"/>
          </g>
        </g>
        <g id="board">
          <rect x="200" y="96" width="118" height="72" rx="4" fill="#5c4630" stroke="#3f2f20" stroke-width="3"/>
          <text x="259" y="119" text-anchor="middle" font-size="13" fill="#ffe6b0" font-family="sans-serif">本日の定食</text>
          <text x="259" y="141" text-anchor="middle" font-size="17" fill="#ffd27a" font-family="sans-serif">¥1,480</text>
          <text x="259" y="158" text-anchor="middle" font-size="8.5" fill="#e0c9a5" font-family="sans-serif">現金 / 一部キャッシュレス可</text>
        </g>
        <g id="signQR">
          <rect x="336" y="104" width="84" height="62" rx="4" fill="#fff8ea" stroke="#b39b76" stroke-width="2"/>
          <text x="378" y="121" text-anchor="middle" font-size="8.5" fill="#7a6244" font-family="sans-serif">ご利用いただけます</text>
          <rect x="366" y="126" width="24" height="24" fill="#2a231c"/>
          <rect x="370" y="130" width="6" height="6" fill="#fff8ea"/>
          <rect x="381" y="140" width="6" height="6" fill="#fff8ea"/>
          <text x="378" y="162" text-anchor="middle" font-size="8" fill="#7a6244" font-family="sans-serif">ニコニコPay</text>
        </g>
        <rect x="352" y="252" width="288" height="15" rx="3" fill="#a97c52"/>
        <rect x="352" y="267" width="288" height="60" fill="#8a6340"/>
        <g id="register">
          <rect x="462" y="212" width="64" height="42" rx="4" fill="#4a4f57"/>
          <rect x="470" y="219" width="48" height="19" rx="2" fill="#8fd0c0"/>
          <rect x="470" y="242" width="48" height="6" rx="2" fill="#2f343b"/>

/* engine-core.js — 音・状態・HUD・シーン描画・会話プレイヤー */
/* =========================================================

"use strict";

/* ---------- tiny audio ---------- */
const Snd = (()=>{
  let ctx=null, on=true;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return ctx; }
  function tone(f,d,type,vol,slideTo){
    if(!on) return; const c=ac(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+d);
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.06,c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d+0.02);
  }
  return {
    toggle(){ on=!on; return on; },
    isOn(){ return on; },
    tap(){ tone(620,0.05,'square',0.03); },
    type(){ tone(1400,0.012,'square',0.008); },
    ok(){ tone(660,0.09,'triangle',0.06); setTimeout(()=>tone(990,0.16,'triangle',0.06),90); },
    fail(){ tone(300,0.16,'sawtooth',0.05,140); },
    deny(){ tone(200,0.3,'square',0.04,90); },
    drama(){ tone(58,1.5,'sine',0.14); tone(87,1.5,'sine',0.05); },
    ring(){ tone(440,0.3,'sine',0.05); setTimeout(()=>tone(440,0.3,'sine',0.05),450); },
    ding(){ tone(880,0.07,'sine',0.05); setTimeout(()=>tone(1320,0.13,'sine',0.05),70); },
    buzz(){ tone(120,0.5,'sawtooth',0.05); }
  };
})();

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const yen = n=>'¥'+n.toLocaleString('ja-JP');

/* ---------- state ---------- */
let S;

  return {
    trust:50, shame:5, conf:0,
    fugitive:0, annoy:0, kindness:70, attention:0,
    batt:47, min:0, acts:0,

    unlocked:new Set(), seenNew:new Set(),
    app:null, playing:false, ended:null, waitCount:0,
    tab:'search', log:[]
  };
}
function has(f){ return S.flags.has(f); }
function on(f){ S.flags.add(f); }
function clockStr(){
  const t=13*60+12+S.min;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

/* ---------- notices & deltas ---------- */
function notice(txt,kind){
  const el=document.createElement('div');
  el.className='notice'+(kind?' '+kind:''); el.textContent=txt;
  $('#noticeLayer').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); },2600);
}
const PARAM_LABEL={trust:'信用度',shame:'羞恥心',conf:'店員の困惑',fugitive:'逃亡犯感',annoy:'面倒な客度',kindness:'店員の優しさ',attention:'周囲の注目度'};
function showDelta(key,v){
  const el=document.createElement('div');
  el.className='delta';
  el.textContent=PARAM_LABEL[key]+' '+(v>0?'+':'')+v;
  const bad=(key==='trust'||key==='kindness')?v<0:v>0;
  el.style.color= bad?'#ff9f8f':'#9fe8bf';
  el.style.left=(18+Math.random()*46)+'%';
  el.style.top=(30+Math.random()*34)+'%';
  $('#deltaLayer').appendChild(el);
  setTimeout(()=>el.remove(),1400);
}
function applyFx(fx){
  if(!fx) return;
  let i=0;
  for(const k in fx){
    const v=fx[k]; if(!v) continue;
    S[k]=clamp(S[k]+v, 0, k==='trust'||k==='kindness'?100:200);
    setTimeout(((kk,vv)=>()=>showDelta(kk,vv))(k,v), i*180); i++;
  }
  renderHUD();
}

/* ---------- HUD ---------- */
function renderHUD(){
  $('#vTrust').textContent=S.trust; $('#bTrust').style.width=S.trust+'%';
  $('#vShame').textContent=S.shame; $('#bShame').style.width=clamp(S.shame,0,100)+'%';
  $('#vConf').textContent=S.conf;   $('#bConf').style.width=clamp(S.conf,0,100)+'%';
  $('#clock').textContent=clockStr();
  $('#pClock').textContent=clockStr();
  const b=Math.round(S.batt);
  $('#battLv').style.width=clamp(b,0,100)+'%';
  $('#battTx').textContent=b+'%';
  $('#pBatt').textContent=(b<=10?'🪫':'🔋')+b+'%';
  const w=$('#battWrap'); w.className='batt'+(b<=10?' crit':(b<=20?' low':''));
  $('#handset').classList.toggle('dead', b<=0);
}

/* ---------- scene ---------- */
const FACES={
  normal:{eyes:['circle','circle'],mouth:'M-7 38 q7 5 14 0',brow:'flat'},
  smile:{mouth:'M-8 37 q8 7 16 0',brow:'up'},
  worry:{mouth:'M-7 40 q7 -4 14 0',brow:'down'},
  confused:{mouth:'M-7 39 q4 -4 7 1 q3 4 7 -1',brow:'tilt'},
  gentle:{mouth:'M-7 38 q7 6 14 0',brow:'up'},
  blank:{mouth:'M-7 39 h14',brow:'flat'}
};
function setFace(name){
  const f=FACES[name]||FACES.normal;
  $('#faceMouth').setAttribute('d',f.mouth);
  const bl=$('#faceBrowL'), br=$('#faceBrowR');
  const B={up:['M-14 15 q5 -4 10 -1','M4 14 q5 3 10 1'],
           flat:['M-14 16 q5 -3 10 0','M4 16 q5 -3 10 0'],
           down:['M-14 17 q5 -4 10 -4','M4 13 q5 4 10 4'],
           tilt:['M-14 16 q5 -5 10 -3','M4 14 q5 1 10 3']};
  const s=B[f.brow]||B.flat; bl.setAttribute('d',s[0]); br.setAttribute('d',s[1]);
}
function clerkEmote(ch){
  const e=$('#clerkEmote'); e.textContent=ch||'';
  e.setAttribute('opacity', ch?'1':'0');
  if(ch) setTimeout(()=>e.setAttribute('opacity','0'),2200);
}
function nbEmote(ch){
  const e=$('#nbEmote'); e.textContent=ch||'';
  e.setAttribute('opacity', ch?'1':'0');
  if(ch) setTimeout(()=>e.setAttribute('opacity','0'),2200);
}
const QUEUE_COLORS=['#7d6b8f','#5f7f6b','#8f6b5f','#5f6f8f','#8f8a5f'];
function renderScene(){
  // clerk expression by confusion
  if(S.conf>=70) setFace('confused');
  else if(S.conf>=40) setFace('worry');
  else if(S.kindness>=70) setFace('gentle');
  else setFace('normal');
  // queue grows with time
  const q=$('#queue'); const want=clamp(Math.floor((S.min-6)/5),0,5);
  while(q.childElementCount>want) q.lastElementChild.remove();
  while(q.childElementCount<want){
    const i=q.childElementCount;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform','translate('+(592-i*42)+',206) scale(.62)');
    g.setAttribute('opacity','0');
    g.innerHTML='<ellipse cx="0" cy="126" rx="24" ry="6" fill="#00000022"/>'+
      '<path d="M-22 56 q22 -14 44 0 l5 66 h-54 z" fill="'+QUEUE_COLORS[i%5]+'"/>'+
      '<circle cx="0" cy="26" r="22" fill="#eec8a4"/>'+
      '<path d="M-23 18 q23 -30 46 0 q-6 -20 -23 -20 q-17 0 -23 20z" fill="#3a2b21"/>'+
      '<circle cx="-8" cy="26" r="2" fill="#2a231c"/><circle cx="8" cy="26" r="2" fill="#2a231c"/>';
    q.appendChild(g);
    requestAnimationFrame(()=>{ g.style.transition='opacity .6s'; g.setAttribute('opacity','1'); });
  }
  $('#clockFace').textContent=clockStr();
}
function fxBlack(v){ $('#sceneFx').classList.toggle('on',!!v); }
function fxShake(){ const s=$('#scene'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
function fxDrama(txt){
  const d=$('#dramaText');
  if(!txt){ d.classList.remove('on'); return; }
  d.textContent=txt; d.classList.remove('on'); void d.offsetWidth; d.classList.add('on'); Snd.drama();
}

/* ---------- dialogue player ---------- */
const NAME={
  me:'主人公', inner:'（心の声）', clerk:'店員', clerk2:'店員（男性）', mgr:'店長',
  nb:'隣の客', nb2:'学生風の客', sys:'', phone:'📱', ai:'AIチャット',
  voice:'自動音声', friend:'友人', mom:'母', tel:'☎', line:'LINE'
};
let dq=[], dqDone=null, typing=null, typedFull='';
function setLock(v){
  document.getElementById('choices').classList.toggle('locked', !!v);
  document.getElementById('phoneLock').style.display = v ? 'flex' : 'none';
}
function play(lines, done){
  dq = (lines||[]).slice(); dqDone = done||null; S.playing=true;
  $('#dlgNext').classList.remove('on');
  setLock(true); renderActions();
  nextLine();
}
function nextLine(){
  if(typing){ clearInterval(typing); typing=null; }
  if(!dq.length){
    S.playing=false; $('#dlgNext').classList.remove('on');
    setLock(false);
    const d=dqDone; dqDone=null; renderActions(); renderPhone();
    if(d) d();
    return;
  }
  const L=dq.shift();
  const who=L[0], text=L[1]||'', o=L[2]||{};
  if(o.face) setFace(o.face);
  if(o.emote) clerkEmote(o.emote);
  if(o.nbEmote) nbEmote(o.nbEmote);
  if(o.fx==='black') fxBlack(true);
  if(o.fx==='unblack'){ fxBlack(false); fxDrama(null); }
  if(o.fx==='shake') fxShake();
  if(o.drama) fxDrama(o.drama);
  if(o.sfx && Snd[o.sfx]) Snd[o.sfx]();
  if(o.batt) { S.batt=clamp(S.batt+o.batt,0,100); renderHUD(); }
  if(o.wallet){ const w=document.getElementById('wallet'); w.style.transition='opacity 1.6s'; w.setAttribute('opacity','1'); }
  $('#dlgName').textContent = NAME[who]!==undefined?NAME[who]:who;
  const target=$('#dlgText');
  target.className = (who==='inner')?'':'';
  typedFull=text;
  target.innerHTML='';
  const span=document.createElement('span');
  if(who==='inner') span.className='inner';
  target.appendChild(span);
  let i=0;
  const speed = o.slow?46:(text.length>60?16:22);
  typing=setInterval(()=>{
    i++; span.textContent=text.slice(0,i);
    if(i%3===0) Snd.type();
    if(i>=text.length){ clearInterval(typing); typing=null; $('#dlgNext').classList.add('on'); }
  }, speed);
  if(o.wait){ setTimeout(()=>{}, 0); }
}
function advance(){
  if(!S.playing) return;
  if(typing){ clearInterval(typing); typing=null;
    $('#dlgText').firstChild.textContent=typedFull; $('#dlgNext').classList.add('on'); return; }
  nextLine();
}
$('#dialogue').addEventListener('click', advance);
$('#lockNote').addEventListener('click', advance);
$('#phoneLock').addEventListener('click', advance);
$('#scene').addEventListener('click', e=>{ if(e.target.closest('#phoneToggle')) return; if(S.playing) advance(); });
$('#choices').addEventListener('click', e=>{ if(S.playing){ e.preventDefault(); e.stopPropagation(); advance(); } }, true);
$('#pscreen').addEventListener('click', e=>{ if(S.playing){ e.preventDefault(); e.stopPropagation(); advance(); } }, true);
document.addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){ if(S.playing){ e.preventDefault(); advance(); } }
});

  clerk_explain:['clerk_later','clerk_mgr','clerk_dishwash','clerk_key','clerk_conveni',

const CATS=[{id:'search',name:'探す・思い出す'},{id:'clerk',name:'店員と話す'},{id:'around',name:'まわり'},{id:'misc',name:'その他'}];
const byId={}; ACTS.forEach(a=>byId[a.id]=a);

function usedCount(id){ return S.count[id]||0; }
function maxOf(a){ return a.max|| (a.linesBy?a.linesBy.length:1); }
function available(a){
  if(!S.unlocked.has(a.id)) return false;
  if(usedCount(a.id) >= maxOf(a)) return false;
  if(a.req && !a.req()) return false;
  if(a.cat==='phone' && S.batt<=0) return false;
  return true;
}
function linesFor(a){
  if(a.linesBy){ const i=Math.min(usedCount(a.id), a.linesBy.length-1); return a.linesBy[i]; }
  return a.lines||[['sys','……']];
}

function doAction(id){
  const a=byId[id]; if(!a||S.playing||S.ended) return;
  if(a.risky && !S.count['__c_'+id]){
    $('#confirmText').textContent=a.risky;
    $('#confirmOv').classList.add('on');
    $('#cYes').onclick=()=>{ $('#confirmOv').classList.remove('on'); S.count['__c_'+id]=1; doAction(id); };
    $('#cNo').onclick=()=>{ $('#confirmOv').classList.remove('on'); };
    return;
  }
  Snd.tap();
  S.count[id]=usedCount(id)+1;
  S.done.add(id); S.acts++;
  S.min += (a.time||1);
  const bd = (a.batt!==undefined) ? a.batt : (a.cat==='phone' ? -2 : 0);
  S.batt = clamp(S.batt + bd, 0, 100);
  if(a.fn) a.fn();
  if(a.flag) on(a.flag);
  if(AUTOFLAG[a.id]) on(AUTOFLAG[a.id]);
  if(a.chat) on('chat_'+a.chat);
  const uls=[].concat(a.unlock||[], EXTRA_UNLOCK[a.id]||[]);
  uls.forEach(u=>{ if(byId[u] && !S.unlocked.has(u)){ S.unlocked.add(u); S.seenNew.add(u); } });
  applyFx(a.fx);
  renderScene(); renderHUD();
  play(linesFor(a), ()=>{
    if(a.end){ endGame(a.end); return; }
    afterAction();
  });
}

function afterAction(){
  renderScene(); renderHUD();
  // events
  for(const ev of EVENTS){
    if(S.flags.has('ev_'+ev.id)) continue;
    if(ev.when()){
      on('ev_'+ev.id);
      applyFx(ev.fx);
      if(ev.id==='ev_line_reply') on('friendComing');
      (ev.unlock||[]).forEach(u=>{ if(byId[u]){ S.unlocked.add(u); S.seenNew.add(u); } });
      play(ev.lines, afterAction);
      return;
    }
  }
  // TRUE END
  if((S.done.size>=28 || S.acts>=38) && !S.ended && !has('trueStarted')){
    on('trueStarted');
    play(TRUE_LINES, ()=>endGame('true_found'));
    return;
  }
  renderActions(); renderPhone();
}

/* ---------- 選択肢描画 ---------- */
function renderActions(){
  setLock(S.playing);
  const tabs=$('#tabs'), list=$('#actionList');
  const avail={}; CATS.forEach(c=>avail[c.id]=[]);
  ACTS.forEach(a=>{ if(a.cat!=='phone' && available(a)) avail[a.cat] && avail[a.cat].push(a); });
  tabs.innerHTML=CATS.map(c=>{
    const n=avail[c.id].length;
    const isNew=avail[c.id].some(a=>S.seenNew.has(a.id));
    return '<button class="tab'+(S.tab===c.id?' on':'')+'" data-t="'+c.id+'">'+c.name+'<span class="n">'+n+'</span>'+(isNew?'<span class="dot"></span>':'')+'</button>';
  }).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; Snd.tap(); renderActions(); });
  const arr=avail[S.tab]||[];
  if(!arr.length){ list.innerHTML='<div class="emptyNote">ここには、もう試せることがない。<br>別のタブか、スマホを見てみよう。</div>'; return; }
  list.innerHTML=arr.map(a=>{
    const rest = maxOf(a)>1 ? '（あと'+(maxOf(a)-usedCount(a.id))+'回）' : '';
    return '<button class="act'+(S.seenNew.has(a.id)?' new':'')+(a.risky?' risky':'')+'" data-a="'+a.id+'">'+
      a.label+'<span class="sub">'+(a.sub||'')+rest+'</span></button>';
  }).join('');
  list.querySelectorAll('.act').forEach(b=>b.onclick=()=>{
    if(S.playing) return;
    S.seenNew.delete(b.dataset.a);
    doAction(b.dataset.a);
  });
}

    (acts.length? acts.map(a=>{

 ['sys','',{slow:true}],
 ['inner','……',{slow:true}],
 ['inner','まあいいか。'],
 ['inner','今どき、スマホがあれば何とかなるだろ。'],
 ['sys','',{fx:'black'}],
 ['sys','',{drama:'お会計になります',sfx:'drama',slow:true}],
 ['sys','',{fx:'unblack'}],
 ['clerk','……お客様？',{face:'gentle',emote:'？'}],
 ['me','あ、はい。今すぐ',{}]
];
const SHORT_INTRO=[
 ['sys','―― もう一度 ――'],
 ['clerk','お会計、1,480円になります',{face:'smile'}],
 ['me','はい',{}],
 ['sys','ポケット。カバン。上着。もう一度ポケット。'],
 ['sys','',{fx:'shake'}],
 ['me','……ない',{}],
 ['inner','また忘れた。'],
 ['inner','……まあいいか。'],
 ['inner','今どき、スマホがあれば何とかなるだろ。']
];
let runCount=0;
function curtain(txt, sub, mid){
  const c=$('#curtain');
  $('#curtainTxt').textContent=txt||'';
  $('#curtainSub').textContent=sub||'';
  c.classList.add('on');
  setTimeout(()=>{
    if(mid) mid();
    setTimeout(()=>c.classList.remove('on'), 780);
  }, 640);
}
function flashNewGame(txt){
  const f=$('#newGameFlash');
  f.textContent=txt;
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}
function restartGame(mode){
  $('#endOv').classList.remove('on');
  $('#confirmOv').classList.remove('on');
  curtain('もう一度', 'お会計 ¥1,480 ／ 13:12', ()=>startGame(mode||'again'));
}
function startGame(mode){
  runCount++;
  S=freshState();
  const wEl=$('#wallet'); wEl.style.transition='none'; wEl.setAttribute('opacity','0');
  $('#queue').innerHTML='';
  fxBlack(false); fxDrama(null);
  INIT_UNLOCK.forEach(id=>{ if(byId[id]) S.unlocked.add(id); });
  renderHUD(); renderScene(); setFace('smile');
  $('#title').classList.remove('on');
  $('#endOv').classList.remove('on');
  const rt=$('#runTag');
  rt.textContent=runCount+'周目';
  rt.classList.toggle('on', runCount>1);
  if(runCount>1) flashNewGame('NEW GAME ・ '+runCount+'周目 ・ お会計 ¥1,480');
  if(mode==='full'){ play(INTRO, ()=>{ renderActions(); renderPhone(); }); }
  else if(mode==='again'){ play(SHORT_INTRO, ()=>{ renderActions(); renderPhone(); }); }
  else {
    S.playing=false; setLock(false);
    $('#dlgName').textContent='';
    $('#dlgText').textContent='財布がない。でもスマホはある。何とかなるはずだ。';
    $('#dlgNext').classList.remove('on');
    renderActions(); renderPhone();
  }
}
$('#btnStart').onclick=()=>{ startGame('full'); };
$('#btnSkip').onclick=()=>{ startGame('skip'); };
$('#btnRestart').onclick=()=>{
  $('#confirmText').textContent='最初からやり直しますか？\n（財布は、たぶんまた忘れます）';
  $('#confirmOv').classList.add('on');
  $('#cYes').onclick=()=>{ restartGame('again'); };
  $('#cNo').onclick=()=>{ $('#confirmOv').classList.remove('on'); };
};
$('#btnSound').onclick=e=>{ const on=Snd.toggle(); e.currentTarget.textContent=on?'🔊':'🔇'; };
$('#phoneToggle').onclick=()=>{
  const el=$('#phone'); el.classList.toggle('open'); Snd.tap();
  $('#phoneToggle').innerHTML = el.classList.contains('open') ? '✕ 閉じる' : '📱 スマホ<span id="ptBadge"></span>';
  if(!el.classList.contains('open')) renderPhone();
};
$('#phone').addEventListener('click', e=>{ if(e.target.id==='phone'){ $('#phone').classList.remove('open'); $('#phoneToggle').innerHTML='📱 スマホ<span id="ptBadge"></span>'; renderPhone(); } });

S=freshState(); renderHUD(); setFace('smile');
</script>
